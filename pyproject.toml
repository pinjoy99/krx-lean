[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "krx-lean"
version = "0.0.2"
description = "KRX (KOSPI, ETF) daily data and market models for QuantConnect LEAN built from source, with klean, a local workspace tool"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# Only for `krx-lean yahoo-daily` (cross-checking the KRX data against Yahoo Finance).
crosscheck = ["yfinance>=0.2.54"]

[project.scripts]
krx-lean = "krx_lean.cli:main"
klean = "klean.cli:main"

[tool.setuptools]
packages = ["krx_lean", "klean"]

[tool.setuptools.package-data]
klean = ["static/*.html"]
